# 99 districts that keep LA Times neighborhoods whole where they can, and also
# route around freeways, rail, the LA River and the Mulholland ridge.
districts  = 99
keep_whole = "neighborhoods"
stick      = 1.5
barriers   = ["freeways", "rail", "la_river", "mulholland"]
barrier_routing  = true
barrier_strength = 4.0
out = "../out/natural-borders"
