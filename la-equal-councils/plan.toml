# Default plan for redistrict.py. Every setting is optional; anything left out
# uses the value shown here. Command-line flags override this file, e.g.
#   python redistrict.py build --districts 51 --tolerance 0.02
# Copy it into plans/ to keep variations side by side, then
#   python redistrict.py build --config plans/my-plan.toml
#
# The defaults follow California's FAIR MAPS Act criteria, in its order:
#   equal population  ->  contiguity  ->  recognizable boundaries  ->  compactness
# These districts replace today's councils, so their lines aren't a constraint (see [neighborhoods]).
# See "Fairness rules" in the README.

[districts]
districts  = 99        # how many districts to draw. 99 = one per certified council (keeps names and heir_of)
balance_on = "pop"     # what every district gets an equal share of:
                       #   pop           residents (what FAIR MAPS uses)
                       #   vap           adults 18 and over
                       #   households    occupied homes
                       #   housing_units all homes, occupied or not
tolerance  = 0.01      # largest allowed difference from an equal share: 0.01 = ±1%.
                       # The slack lets lines slide onto freeways, rail and the river; ±2.5% buys
                       # barely rounder shapes. ~0.005 is the tightest blocks allow.

[territory]
coverage = "all"       # "all" = the whole city; "councils" = certified councils only;
                       # or LA Times neighborhood names: "Pacific Palisades,Brentwood"
units    = "blocks"    # "blocks" (precise; needs `python redistrict.py fetch`) or "tracts" (quick and rough)

[population]
# Optional: swap in other block-level counts, such as the Statewide Database's adjusted
# P.L. 94-171 that counts incarcerated people at their last address (FAIR MAPS requires it
# for cities). Map our column names to the file's; unmapped columns keep census values.
population_file    = ""
population_columns = {}  # e.g. { pop = "TOTPOP", pop_hisp = "HISPANIC" } - check the file's data dictionary

[neighborhoods]
# Optional. Off by default: the districts replace today's councils, so nothing ties them to the old lines.
keep_whole       = "none"      # what to keep together: "none", "councils" (today's) or "neighborhoods" (LA Times)
keep_small_whole = true        # with keep_whole: a group smaller than one district isn't split unless
                               # the tolerance can't be met otherwise (each such split is logged)
stick            = 1.0         # with keep_whole: for groups bigger than a district, how hard to keep pieces few

[boundaries]
barriers = ["freeways", "rail", "la_river", "mulholland"]
                          # lines residents recognize; district lines are drawn onto them where they can be.
                          # Also any line or polygon file, e.g. "my_lines.gpkg"
smooth   = true           # after balancing, slide lines onto barriers (within tolerance)
barrier_routing  = false  # also measure distance along the street network, so crossings cost more
barrier_strength = 3.0    # with barrier_routing: a crossing counts as this many times the distance

[shape]
seeds       = "auto"      # where districts start: "councils" (one at each council's center, needs districts = 99),
                          # "kmeans" (population-weighted), or "auto" (councils when possible)
random_seed = 1           # changes the k-means starting points

[output]
out = "out"               # folder for la_nc_equal_pop.gpkg and friends (relative to this file)
